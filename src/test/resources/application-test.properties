# Perfil de teste: timings curtos e credenciais fake.
# As URLs do scraper/WhatsApp são injetadas via @DynamicPropertySource (WireMock).

app.credentials.client-code=TEST-CLIENT
app.credentials.username=testuser
app.credentials.password=testpass

app.scraper.wait-seconds=5
app.scraper.sleep-millis.navigation=50
app.scraper.sleep-millis.pagination=100

resilience4j.retry.instances.login.max-attempts=3
resilience4j.retry.instances.login.wait-duration=200ms
resilience4j.retry.instances.login.enable-exponential-backoff=false
resilience4j.retry.instances.login.max-wait-duration=200ms

resilience4j.retry.instances.whatsapp.max-attempts=2
resilience4j.retry.instances.whatsapp.wait-duration=100ms

app.reports.output-directory=target/relatorios-teste
