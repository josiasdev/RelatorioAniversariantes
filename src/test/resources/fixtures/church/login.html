<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Church - Login (fixture de teste)</title>
</head>
<body>
<h1>Church - Acesso ao Sistema</h1>
<form id="form-cliente">
    <label for="codcliente">Código do Cliente</label>
    <input type="text" id="codcliente" name="codcliente"/>
    <button type="button" id="btn-proximo">Próximo</button>
</form>
<form id="form-login">
    <label for="username">Usuário</label>
    <input type="text" id="username" name="username"/>
    <label for="password">Senha</label>
    <input type="password" id="password" name="password"/>
    <button type="button" id="btn-entrar">Entrar</button>
</form>
</body>
</html>
