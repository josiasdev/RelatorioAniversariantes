spring.application.name=RelatorioAniversariantes

# --- CREDENCIAIS DO SISTEMA CHURCH (via variáveis de ambiente) ---
app.credentials.client-code=${CHURCH_CLIENT_CODE:}
app.credentials.username=${CHURCH_USERNAME:}
app.credentials.password=${CHURCH_PASSWORD:}

# --- URLS DO SISTEMA CHURCH ---
# Externalizadas para permitir apontar para fixtures nos testes de integração.
app.scraper.urls.login=https://church15.churchsoftware.com.br/frmlogin/
app.scraper.urls.aniversarios=https://church15.churchsoftware.com.br/ctrtipoaniversario/ctrtipoaniversario.php
app.scraper.urls.casamentos=https://church15.churchsoftware.com.br/rptCasaAniv/rptCasaAniv.php

# --- TIMINGS DO SCRAPER ---
app.scraper.wait-seconds=100
app.scraper.sleep-millis.navigation=2000
app.scraper.sleep-millis.pagination=3000

# --- CONFIGURAÇÕES DO WHATSAPP (EVOLUTION API) ---
whatsapp.api.base-url=${WHATSAPP_BASE_URL:http://localhost:8081}
whatsapp.api.instance=${WHATSAPP_INSTANCE:igreja}
whatsapp.api.key=${EVOLUTION_API_KEY:}
# Número do destinatário (Código do país + DDD + Número)
whatsapp.destinatario=${WHATSAPP_DESTINATARIO:}

# --- PASTA E RETENÇÃO DE RELATÓRIOS ---
app.reports.output-directory=relatorios
app.reports.retention-days=30

# --- RESILIENCE4J ---
resilience4j.retry.instances.login.max-attempts=3
resilience4j.retry.instances.login.wait-duration=2s
resilience4j.retry.instances.login.enable-exponential-backoff=true
resilience4j.retry.instances.login.exponential-backoff-multiplier=2
resilience4j.retry.instances.login.max-wait-duration=10s
resilience4j.retry.instances.login.ignore-exceptions=java.lang.InterruptedException

resilience4j.retry.instances.whatsapp.max-attempts=2
resilience4j.retry.instances.whatsapp.wait-duration=3s
resilience4j.retry.instances.whatsapp.ignore-exceptions=java.lang.InterruptedException

# --- ACTUATOR / OBSERVABILIDADE ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

server.max-http-request-header-size=64KB
